services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: learning-game-db
    environment:
      POSTGRES_DB: learning_game
      POSTGRES_USER: gameuser
      POSTGRES_PASSWORD: gamepass123
    ports:
      - "5432:5432"
    volumes:
      # Named volume for persistent data - survives container restarts
      - postgres_data:/var/lib/postgresql/data
      # Migration scripts - run ONLY on first startup (when volume is empty)
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gameuser -d learning_game"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - learning-game-network

  # Backend API (Golang)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: learning-game-backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: gameuser
      DB_PASSWORD: gamepass123
      DB_NAME: learning_game
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Mount source code for hot-reload during development
      - ./backend:/app
      # Preserve node_modules (if any)
      - /app/tmp
    networks:
      - learning-game-network
    restart: unless-stopped

  # Frontend (React)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: learning-game-frontend
    environment:
      # Use backend service name for internal Docker networking
      # For external browser access, use localhost:8080
      REACT_APP_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      # Mount source code for hot-reload during development
      - ./frontend:/app
      # Preserve node_modules
      - /app/node_modules
    stdin_open: true
    tty: true
    networks:
      - learning-game-network
    restart: unless-stopped

volumes:
  # Persistent volume for PostgreSQL data
  # This survives docker-compose down and restarts
  postgres_data:
    driver: local

networks:
  learning-game-network:
    driver: bridge
